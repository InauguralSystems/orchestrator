# orchestrator.yaml — your company, as configuration.
# Copy this to `orchestrator.yaml` in your company repo (or run
# `orchestrator init`) and fill it in. Everything Orchestrator does is
# driven from this file — there is no hardcoded org, path, or repo anywhere.

# --- Identity -----------------------------------------------------------
company: Acme                 # your company / portfolio name
ceo: Jane Doe                 # the human who holds the vetoes (the only human)
chief_of_staff: triage        # the router skill `orchestrator work` reports to
                              # (optional; defaults to `triage`)
work_timeout: 3600            # deterministic wall-clock bound (a timeout(1)
                              # duration) under the work loop's honest-halt, so it
                              # can't run away. Optional; unset = no hard bound.
progress_file: reports/PROGRESS.md  # the work loop's external memory — read at
                              # session start, appended via `orchestrator progress`.
                              # Repo-relative (to this file). Optional; this is the
                              # default. Lets a later session resume without re-deriving.

# --- Safe autonomy (the guardrail pack — see `orchestrator hook`) --------
gate: bash tests/run.sh       # the command the Stop-gate runs on a dirty tree;
                              # red -> the turn can't end. Empty/unset = no gate.
protected_branches: main master  # deny-guard blocks force-push/delete of these

# The n=5 statistical gate for PERFORMANCE claims (`orchestrator perf-gate`).
# A build/test gate is binary; a perf claim is statistical — one-shots are noise.
perf_gate: bash bench.sh      # a command that prints ONE metric number per run
perf_n: 5                     # runs per measurement (default 5, min 3)
perf_lower_is_better: true    # true for time/latency, false for throughput
github_org: acme-inc          # GitHub org/owner for CI + backlog signals
                              # (leave blank to derive from each repo's git remote)

# --- Where your code lives ----------------------------------------------
root: ~/src/acme              # parent dir that holds all the repos below
                              # (siblings of your company repo)

# --- The employee roster (AI skills) ------------------------------------
live_skills: ~/.claude/skills # the LIVE skills tree Claude Code reads from
skills_dir: skills            # where the committed copy lives inside THIS repo
                              # (relative to the company repo)

# --- The portfolio ------------------------------------------------------
# One "- name:category" per repo. Categories drive how each is scored:
#   product  — the thing everything else exists to build (0 or 1 of these)
#   consumer — an app/lib that exercises the product (a forcing function)
#   infra    — distribution / CI / plumbing
#   sibling  — deliberately coupled to a checkout; exempt from some signals
#   subsidiary — a child company (its own orchestrator/health); its verdict is
#              rolled up from that repo's reports/latest.md instead of re-scored.
#              A report older than ORCH_SUBSIDIARY_STALE_DAYS (default 7) can't
#              read as fresh: a stale non-failing verdict drops to WARN.
#   parked   — silence is healthy; reported but never scored
repos:
  - acme-core:product
  - acme-web:consumer
  - acme-cli:consumer
  - acme-infra:infra
  - old-prototype:parked

# --- The constitution ---------------------------------------------------
# Standing vetoes: settled decisions the Chief-of-Staff rejects work against.
# These are surfaced verbatim in ROSTER.md and by the triage skill.
vetoes:
  - No feature ships without a test.
  - Correctness before speed.
  - No dependency added without an owner.
